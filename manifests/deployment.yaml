apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-demo
  namespace: christian
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      label: 
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service 
metadata: 
  namespace: christian
  name: nginx-service
spec:
  selector:
    app: nginx
  ports:
    - protocol: TCP
    - port: 80
      targetPort: 80